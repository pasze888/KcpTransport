name: Build

on:
  push:
    branches:
      - '**'
    # .gitattributes 刻意不排除：它决定 src/generated/** 的换行，会影响产物
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'NOTICE'
      - 'TEMPLATE_LICENSE.txt'
      - 'THIRD-PARTY-NOTICES.md'
      - 'logo.png'
      - '.gitignore'
  # pull_request 不加 paths 过滤：被过滤跳过的必需检查会停在 Pending，会卡住 PR 合并
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      # JDK 版本读 gradle.properties 的 java_version——与 build.gradle 的 toolchain 同源，
      # 两者不会各说各话。键缺失时才回退 21。
      - name: Resolve JDK version
        id: java
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*(java_version|javaVersion)[[:space:]]*=[[:space:]]*//p' gradle.properties | tail -1 | tr -d '\r[:space:]')"
          if [ -z "$VERSION" ]; then
            VERSION="21"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "使用 JDK $VERSION（来源：gradle.properties）"

      - name: Set up JDK ${{ steps.java.outputs.version }}
        uses: actions/setup-java@v6.0.0
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mod-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
